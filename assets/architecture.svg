<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1433"/>
      <stop offset="1" stop-color="#2a1a4a"/>
    </linearGradient>
    <linearGradient id="gpu0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2818"/>
      <stop offset="1" stop-color="#123d24"/>
    </linearGradient>
    <linearGradient id="gpu1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2818"/>
      <stop offset="1" stop-color="#123d24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc8cff"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="52" fill="#e6edf3" font-size="30" font-weight="bold" text-anchor="middle">openbest_pk10_numbers</text>
  <text x="640" y="82" fill="#bc8cff" font-size="16" text-anchor="middle">Dual-GPU OpenCL Lottery-Outcome Risk Engine · 3.6M permutations in ~3s</text>
  <line x1="360" y1="98" x2="920" y2="98" stroke="#30363d" stroke-width="1"/>

  <!-- ===== ROW 1: upstream → flask ===== -->
  <!-- Upstream -->
  <rect x="60" y="140" width="230" height="90" rx="10" fill="#0d2033" stroke="#58a6ff" stroke-width="2"/>
  <text x="175" y="180" fill="#58a6ff" font-size="17" font-weight="bold" text-anchor="middle">Betting Frontend</text>
  <text x="175" y="204" fill="#8b949e" font-size="13" text-anchor="middle">upstream · all wagers</text>

  <!-- Flask -->
  <rect x="380" y="140" width="230" height="90" rx="10" fill="#0d2033" stroke="#58a6ff" stroke-width="2"/>
  <text x="495" y="174" fill="#58a6ff" font-size="17" font-weight="bold" text-anchor="middle">Flask Web Service</text>
  <text x="495" y="196" fill="#8b949e" font-size="12" text-anchor="middle">tools/web_*.py</text>
  <text x="495" y="214" fill="#8b949e" font-size="12" text-anchor="middle">format + IP allowlist</text>

  <!-- arrow upstream->flask -->
  <line x1="290" y1="185" x2="372" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="331" y="176" fill="#6e7681" font-size="11" text-anchor="middle">HTTP</text>

  <!-- socket bar -->
  <rect x="700" y="140" width="150" height="90" rx="10" fill="#2a1e08" stroke="#d29922" stroke-width="2"/>
  <text x="775" y="170" fill="#d29922" font-size="14" font-weight="bold" text-anchor="middle">TCP Socket</text>
  <text x="775" y="190" fill="#8b949e" font-size="11" text-anchor="middle">chunked · '!'</text>
  <text x="775" y="208" fill="#8b949e" font-size="11" text-anchor="middle">8700/8701/8702</text>

  <line x1="610" y1="185" x2="692" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- socket down into engine -->
  <line x1="775" y1="230" x2="775" y2="272" stroke="#d29922" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ===== ENGINE BOX ===== -->
  <rect x="130" y="280" width="1020" height="230" rx="14" fill="url(#engine)" stroke="#bc8cff" stroke-width="2.5"/>
  <text x="165" y="312" fill="#bc8cff" font-size="19" font-weight="bold">optimize_opencode</text>
  <text x="360" y="312" fill="#6e7681" font-size="13">C99 core · while(true) · src/main.c</text>

  <!-- step1: onehot -->
  <rect x="165" y="336" width="200" height="140" rx="10" fill="#160f28" stroke="#8957e5" stroke-width="1.6"/>
  <text x="265" y="368" fill="#d2b8ff" font-size="14" font-weight="bold" text-anchor="middle">1 · Vectorize</text>
  <text x="265" y="396" fill="#8b949e" font-size="12" text-anchor="middle">wagers →</text>
  <text x="265" y="414" fill="#8b949e" font-size="12" text-anchor="middle">one-hot amount</text>
  <text x="265" y="432" fill="#8b949e" font-size="12" text-anchor="middle">vector</text>
  <text x="265" y="456" fill="#6e7681" font-size="11" text-anchor="middle">sum_beton_total</text>

  <line x1="365" y1="406" x2="405" y2="406" stroke="#bc8cff" stroke-width="2" marker-end="url(#arP)"/>

  <!-- champion split diamond -->
  <polygon points="500,346 560,406 500,466 440,406" fill="#241a3d" stroke="#bc8cff" stroke-width="1.8"/>
  <text x="500" y="398" fill="#d2b8ff" font-size="13" font-weight="bold" text-anchor="middle">Champion</text>
  <text x="500" y="416" fill="#d2b8ff" font-size="13" font-weight="bold" text-anchor="middle">Split</text>
  <text x="500" y="486" fill="#6e7681" font-size="11" text-anchor="middle">balls[0] ≤ 5 ?</text>

  <line x1="365" y1="380" x2="446" y2="380" stroke="#8b949e" stroke-width="0" />

  <!-- GPU0 -->
  <rect x="620" y="330" width="230" height="76" rx="10" fill="url(#gpu0)" stroke="#3fb950" stroke-width="2"/>
  <text x="735" y="358" fill="#3fb950" font-size="15" font-weight="bold" text-anchor="middle">GPU 0 · champion 1–5</text>
  <text x="735" y="380" fill="#8b949e" font-size="11.5" text-anchor="middle">table_1 · 1,814,400 perms</text>
  <text x="735" y="397" fill="#6e7681" font-size="11" text-anchor="middle">calc_numbers_risk</text>

  <!-- GPU1 -->
  <rect x="620" y="416" width="230" height="76" rx="10" fill="url(#gpu1)" stroke="#3fb950" stroke-width="2"/>
  <text x="735" y="444" fill="#3fb950" font-size="15" font-weight="bold" text-anchor="middle">GPU 1 · champion 6–10</text>
  <text x="735" y="466" fill="#8b949e" font-size="11.5" text-anchor="middle">table_2 · 1,814,400 perms</text>
  <text x="735" y="483" fill="#6e7681" font-size="11" text-anchor="middle">calc_numbers_risk</text>

  <!-- split -> gpus -->
  <path d="M560,388 Q590,368 616,368" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <path d="M560,424 Q590,454 616,454" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <text x="588" y="352" fill="#6e7681" font-size="10" text-anchor="middle">parallel</text>

  <!-- filter -->
  <rect x="905" y="336" width="215" height="140" rx="10" fill="#160f28" stroke="#8957e5" stroke-width="1.6"/>
  <text x="1012" y="368" fill="#d2b8ff" font-size="14" font-weight="bold" text-anchor="middle">3 · Filter</text>
  <text x="1012" y="394" fill="#8b949e" font-size="12" text-anchor="middle">P&#38;L per draw</text>
  <text x="1012" y="412" fill="#8b949e" font-size="12" text-anchor="middle">vs killRate ×</text>
  <text x="1012" y="430" fill="#8b949e" font-size="12" text-anchor="middle">totalWagered</text>
  <text x="1012" y="456" fill="#6e7681" font-size="11" text-anchor="middle">random pick N</text>

  <!-- gpu -> filter -->
  <line x1="850" y1="368" x2="900" y2="392" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="850" y1="454" x2="900" y2="424" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>

  <!-- ===== OUTPUT ===== -->
  <line x1="1012" y1="510" x2="1012" y2="556" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <rect x="820" y="562" width="385" height="70" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="2"/>
  <text x="1012" y="592" fill="#3fb950" font-size="16" font-weight="bold" text-anchor="middle">Winning Draw Numbers</text>
  <text x="1012" y="614" fill="#8b949e" font-size="12" text-anchor="middle">{draw permutation},{P&#38;L} × N</text>

  <!-- return arrow to socket area (dashed) -->
  <path d="M820,597 Q400,597 400,240" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.65" marker-end="url(#arG)"/>
  <text x="430" y="588" fill="#3fb950" font-size="11" opacity="0.8">socket reply → upstream</text>

  <!-- ===== ANSWER TABLE note ===== -->
  <rect x="130" y="562" width="640" height="70" rx="10" fill="#08251f" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="160" y="590" fill="#2dd4bf" font-size="14" font-weight="bold">Answer Table (precomputed)</text>
  <text x="160" y="612" fill="#8b949e" font-size="12">3,628,800 draws × 1,060 bets ≈ 3.85B cells · W/T/L uchar · split across 2 cards</text>

  <!-- footer legend -->
  <text x="640" y="712" fill="#6e7681" font-size="12" text-anchor="middle">Hand-rolled C99 + OpenCL · 2× RTX 2080 · Linux 5.9.16 · production-grade</text>
</svg>
